  vicreg_weight: 0.001
  sim_weight: 25.0
  std_weight: 25.0
  cov_weight: 1.0
  vicreg_epsilon: 1e-4
  ema:
  - 0.996
  - 1.0
  epochs: 100
  lr: 1.0e-03
  warmup: 15
  start_lr: 1.0e-04
  final_lr: 1.0e-06
  ipe_scale: 1.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  