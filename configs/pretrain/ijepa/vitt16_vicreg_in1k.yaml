app: ijepa
nodes: 1
tasks_per_node: 1
data:
  batch_size: 384
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: imagenet-mini/
  num_workers: 6
  pin_mem: true
  root_path: /users/sboughan/scratch/ssl/ijepa/zdata
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: /users/sboughan/scratch/ssl/ijepa/logs/vitt16.224-bs.24-ep.300/
  write_tag: ijepa
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_tiny
  pred_depth: 6
  pred_emb_dim: 192
  read_checkpoint: null
  use_bfloat16: true
